services:
  api_net:
    build: .
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=base_datos;Port=5432;Database=subasta_db;Username=admin;Password=admin
    depends_on:
      - base_datos

  base_datos:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: subasta_db
    ports:
      - "5432:5432"